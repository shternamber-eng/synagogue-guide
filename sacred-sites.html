<!doctype html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Sacred Sites | Lubavitch</title><link rel='stylesheet' href='style.css'></head><body><main class='container section'><h1>Sacred Sites</h1><div id='sites' class='grid cards-4'></div></main><script>fetch('data/sacredSites.json').then(r=>r.json()).then(d=>{sites.innerHTML=d.map(s=>`<article class='card'><img src='${s.image}' alt='${s.title}' style='width:100%;height:140px;object-fit:cover'><h3>${s.title}</h3><p>${s.description}</p><p><strong>Significance:</strong> ${s.significance}</p><p><strong>Status:</strong> ${s.status}</p><a href='site-${s.slug}.html'>Details</a></article>`).join('')})</script></body></html>
