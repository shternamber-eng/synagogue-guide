<!doctype html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Lubavitch Historical Archive | Photos, Documents and Stories</title><link rel='stylesheet' href='style.css'></head><body><main class='container section'><h1>Archive</h1><p>The archive gathers photographs, maps, documents, stories and records connected to Lubavitch.</p><p class='notice'>Some archival materials may require verification.</p><div id='document.getElementById('archive-list')' class='grid cards-4'></div></main><script>fetch('data/archive.json').then(r=>r.json()).then(d=>document.getElementById('archive-list').innerHTML=d.map(a=>`<article class='card'><h3>${a.title}</h3><p>${a.description}</p><p><strong>Type:</strong>${a.type}</p><p><strong>Status:</strong>${a.verificationStatus}</p></article>`).join(''))</script></body></html>
